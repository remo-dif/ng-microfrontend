server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  location = /federation.manifest.json { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
  location = /remoteEntry.json { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
  location ~* \.(?:js|css|woff2|png|svg)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
