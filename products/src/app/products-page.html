<h1>Products</h1>
<p>{{ count() }} products available</p>
<div class="grid">
  @for (product of products(); track product.id) {
  <article class="card">
    <h2>{{ product.name }}</h2>
    <strong>{{ product.price | currency }}</strong>
    <p>{{ product.stock }} in stock</p>
  </article>
  }
</div>
